<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis Live Conversation</title>
<style>html,body{margin:0;min-height:100%;background:#020b13;color:#e8f7ff;font:16px system-ui}main{max-width:720px;margin:auto;padding:7vh 24px;text-align:center}.orb{width:210px;height:210px;margin:40px auto;border-radius:50%;background:radial-gradient(circle,#bff 0,#0bf 10%,#1249b7 33%,#061326 68%);box-shadow:0 0 35px #0cf,0 0 110px #075cff;animation:pulse 2.5s infinite}.orb.live{animation:pulse .8s infinite}.orb.speaking{box-shadow:0 0 50px #f90,0 0 140px #f43}@keyframes pulse{50%{transform:scale(1.045);filter:brightness(1.3)}}button{background:#073a66;color:#fff;border:1px solid #36bfff;border-radius:24px;padding:13px 24px;font-size:17px;cursor:pointer}button.stop{background:#65222b;border-color:#ff6578}.status{color:#74ddff;margin:18px}.hint{color:#8ba8bc;font-size:14px;line-height:1.5}a{color:#65d9ff}</style>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script></head><body><main><h1>JARVIS LIVE</h1><div id="orb" class="orb"></div><div id="status" class="status">Ready to connect</div><button id="connect">Start Live Conversation</button><p class="hint">Microphone and speaker only. Speak normally; interrupt Jarvis at any time.<br><a href="/dashboard-inline-v25">Return to Command Center</a></p><div id="audio"></div></main>
<script>const $=id=>document.getElementById(id);let room=null;const token=()=>localStorage.getItem('aiApiToken')||localStorage.getItem('jarvisApiToken')||'';async function request(path,options={}){const h=new Headers(options.headers||{});const t=token();if(t)h.set('Authorization','Bearer '+t);if(options.body)h.set('Content-Type','application/json');const r=await fetch(path,{...options,headers:h});const d=await r.json();if(!r.ok)throw Error(d.detail||`HTTP ${r.status}`);return d}function state(text,cls=''){$('status').textContent=text;$('orb').className='orb '+cls}async function stop(){if(room){await room.disconnect();room=null}$('audio').replaceChildren();$('connect').textContent='Start Live Conversation';$('connect').className='';state('Disconnected')}async function start(){try{if(room)return stop();state('Connecting…','live');const credentials=await request('/v1/livekit/token',{method:'POST',body:JSON.stringify({display_name:'Jerry'})});room=new LivekitClient.Room({adaptiveStream:true,dynacast:true});room.on(LivekitClient.RoomEvent.TrackSubscribed,track=>{if(track.kind===LivekitClient.Track.Kind.Audio){const el=track.attach();el.autoplay=true;$('audio').append(el)}});room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged,speakers=>state(speakers.some(p=>p.identity!==room.localParticipant.identity)?'Jarvis is speaking…':'Listening…',speakers.some(p=>p.identity!==room.localParticipant.identity)?'speaking':'live'));room.on(LivekitClient.RoomEvent.Disconnected,()=>{room=null;$('connect').textContent='Start Live Conversation';$('connect').className='';state('Disconnected')});await room.connect(credentials.server_url,credentials.participant_token);await room.startAudio();await room.localParticipant.setMicrophoneEnabled(true);$('connect').textContent='End Conversation';$('connect').className='stop';state('Listening…','live')}catch(e){await stop();state('Could not connect: '+e.message)}}$('connect').onclick=start;window.addEventListener('beforeunload',()=>room?.disconnect())</script></body></html>
