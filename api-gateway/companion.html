<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><link rel="manifest" href="/companion-manifest.json"><title>AI System Companion</title><style>body{font-family:system-ui;margin:0;background:#101114;color:#fff}main{max-width:760px;margin:auto;padding:20px;padding-bottom:40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}select,button,input{font:inherit;padding:13px;border-radius:12px;border:1px solid #444;background:#191b20;color:#fff}select{width:170px}.row{display:flex;gap:8px;margin-top:12px}.row input{flex:1}.bubble{padding:14px;margin:10px 0;border-radius:14px;background:#191b20;white-space:pre-wrap}.me{background:#27324a}.bar{margin:12px 0;color:#aaa;font-size:13px}.talk{width:100%;font-size:20px;margin-top:12px}.confirm{border:1px solid #a88;padding:14px;border-radius:14px;margin-top:10px}.confirm button{margin-right:8px}</style></head><body><main><div class="top"><div><h1>AI System</h1><div class="bar">Local companion • tool-enabled assistant</div><input id="token" type="password" placeholder="LAN token (if enabled)" style="width:100%;box-sizing:border-box"></div><select id="profile"><option value="general">General AI</option><option value="sales">Sales Machine</option></select></div><div id="chat"></div><div class="row"><input id="msg" autocomplete="off" placeholder="Ask your AI..."><button onclick="send()">Send</button></div><button class="talk" onclick="location.href='/voice'">🎙 Talk</button><div id="status" class="bar">Ready</div></main><script>const chat=document.getElementById('chat'),msg=document.getElementById('msg'),profile=document.getElementById('profile'),status=document.getElementById('status'),token=document.getElementById('token');token.value=localStorage.getItem('ai_api_token')||'';token.addEventListener('change',()=>localStorage.setItem('ai_api_token',token.value));function headers(){const h={'Content-Type':'application/json'};if(token.value)h.Authorization='Bearer '+token.value;return h}let pending=null;function add(t,c){let d=document.createElement('div');d.className='bubble '+c;d.textContent=t;chat.appendChild(d);scrollTo(0,document.body.scrollHeight)}function showConfirm(c){pending=c;let d=document.createElement('div');d.className='confirm';d.id='confirm';d.innerHTML='<b>Confirmation required</b><p>'+esc(c.reason||'This action changes data or controls a device.')+'</p><button onclick="confirmAction(true)">Confirm</button><button onclick="confirmAction(false)">Cancel</button>';chat.appendChild(d)}function esc(s){return String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}async function confirmAction(ok){document.getElementById('confirm')?.remove();if(!pending)return;if(!ok){add('Cancelled.','ai');pending=null;return}status.textContent='Executing...';let r=await fetch('/v1/agent/confirm',{method:'POST',headers:headers(),body:JSON.stringify({confirmation_id:pending.confirmation_id,confirmed:true})});let j=await r.json();add(j.result?JSON.stringify(j.result,null,2):(j.detail||JSON.stringify(j)),'ai');pending=null;status.textContent='Ready'}async function send(text){text=(text||msg.value).trim();if(!text)return;msg.value='';add(text,'me');status.textContent='Thinking...';try{let r=await fetch('/v1/agent/chat',{method:'POST',headers:headers(),body:JSON.stringify({model:'auto',assistant_profile:profile.value,messages:[{role:'user',content:text}]})});let j=await r.json();if(j.confirmation){showConfirm(j.confirmation);status.textContent='Waiting for confirmation';return}let a=j.message?.content||j.detail||JSON.stringify(j);add(a,'ai');status.textContent='Ready'}catch(e){add('Connection error: '+e,'ai');status.textContent='Offline'}}msg.addEventListener('keydown',e=>{if(e.key==='Enter')send()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/companion-sw.js').catch(()=>{});</script></body></html>
