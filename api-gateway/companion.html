<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07131e"><link rel="manifest" href="/companion-manifest.json"><title>Jarvis Companion</title><style>
:root{color-scheme:dark;--bg:#06101a;--panel:#0c1d2b;--line:#28526c;--text:#eef7ff;--muted:#99afc4;--cyan:#43cfff;--green:#40e69b;--red:#ff7f91}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:radial-gradient(circle at 50% 0,#102b40,var(--bg) 42%);color:var(--text)}main{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(35px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}h1{margin:0;font-size:28px;letter-spacing:3px}h2{font-size:17px;margin:0 0 10px}.card{background:#071722dc;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}select,button,input{font:inherit;padding:13px;border-radius:12px;border:1px solid #31516a;background:#0d1e2b;color:var(--text)}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}select{width:150px}.row{display:flex;gap:8px;margin-top:12px}.row input{flex:1;min-width:0}.bubble{padding:14px;margin:10px 0;border-radius:14px;background:var(--panel);white-space:pre-wrap;overflow-wrap:anywhere}.me{background:#153352}.bar{margin:8px 0;color:var(--muted);font-size:13px}.talk,.upload-button{width:100%;font-size:17px;margin-top:12px}.upload-button{border-color:var(--cyan)}.confirm{border:1px solid #a88;padding:14px;border-radius:14px;margin-top:10px}.confirm button{margin-right:8px}.file-row{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:10px 0;border-top:1px solid #16374b}.file-row small{color:var(--muted)}.success{color:var(--green)}.error{color:var(--red)}#picker{display:none}
</style></head><body><main><div class="top"><div><h1>JARVIS</h1><div class="bar">iPhone companion • connected to your PC</div></div><select id="profile"><option value="general">General AI</option><option value="sales">Sales Machine</option></select></div><div class="card"><input id="token" type="password" placeholder="Required companion token" style="width:100%"></div><div id="chat"></div><div class="row"><input id="msg" autocomplete="off" placeholder="Ask Jarvis…"><button id="sendButton">Send</button></div><button class="talk" onclick="location.href='/voice'">🎙 Push to talk</button><section class="card"><h2>Send files to your PC</h2><div class="bar">Choose photos, documents, videos, or other files. They are saved in Jarvis’s phone-uploads folder.</div><input id="picker" type="file" multiple><button id="pickButton" class="upload-button">Choose files</button><div id="uploadStatus" class="bar"></div><div id="files"></div></section><div id="status" class="bar">Ready</div></main><script>
const $=id=>document.getElementById(id),chat=$('chat'),msg=$('msg'),profile=$('profile'),status=$('status'),token=$('token'),picker=$('picker'),pickButton=$('pickButton'),uploadStatus=$('uploadStatus'),files=$('files');token.value=sessionStorage.getItem('ai_api_token')||'';token.addEventListener('change',()=>{sessionStorage.setItem('ai_api_token',token.value);loadFiles()});function headers(json=false){const h={};if(json)h['Content-Type']='application/json';if(token.value)h.Authorization='Bearer '+token.value;return h}function esc(s){return String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function add(t,c){const d=document.createElement('div');d.className='bubble '+c;d.textContent=t;chat.appendChild(d);scrollTo(0,document.body.scrollHeight)}async function request(path,options={}){const response=await fetch(path,options);let body={};try{body=await response.json()}catch{}if(!response.ok)throw Error(body.detail||('HTTP '+response.status));return body}
let pending=null;function showConfirm(c){pending=c;const d=document.createElement('div');d.className='confirm';d.id='confirm';d.innerHTML='<b>Confirmation required</b><p>'+esc(c.reason||'This action changes data or controls a device.')+'</p><button onclick="confirmAction(true)">Confirm</button><button onclick="confirmAction(false)">Cancel</button>';chat.appendChild(d)}async function confirmAction(ok){$('confirm')?.remove();if(!pending)return;if(!ok){add('Cancelled.','ai');pending=null;return}status.textContent='Executing…';try{const result=await request('/v1/companion/confirm',{method:'POST',headers:headers(true),body:JSON.stringify({confirmation_id:pending.confirmation_id,confirmed:true})});add(result.message?.content||JSON.stringify(result.result||result,null,2),'ai')}catch(error){add('Action failed: '+error.message,'error')}pending=null;status.textContent='Ready'}async function send(text){text=(text||msg.value).trim();if(!text)return;msg.value='';add(text,'me');status.textContent='Thinking…';try{const result=await request('/v1/companion/chat',{method:'POST',headers:headers(true),body:JSON.stringify({model:'auto',assistant_profile:profile.value,messages:[{role:'user',content:text}]})});if(result.confirmation){showConfirm(result.confirmation);status.textContent='Waiting for confirmation';return}add(result.message?.content||JSON.stringify(result),'ai');status.textContent='Ready'}catch(error){add('Connection error: '+error.message,'error');status.textContent='Offline'}}
function formatBytes(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}async function loadFiles(){if(!token.value){files.textContent='Enter the companion token to see uploads.';return}try{const result=await request('/v1/companion/files?limit=20',{headers:headers()});files.replaceChildren();for(const item of result.files){const row=document.createElement('div');row.className='file-row';row.innerHTML='<span>'+esc(item.name)+'</span><small>'+formatBytes(item.size)+'</small><small>'+esc(item.relative_path)+'</small>';files.appendChild(row)}if(!result.files.length)files.textContent='No phone uploads yet.'}catch(error){files.textContent='Could not load files: '+error.message}}async function uploadSelected(){const selected=[...picker.files];if(!selected.length)return;pickButton.disabled=true;let completed=0;try{for(const file of selected){uploadStatus.className='bar';uploadStatus.textContent=`Uploading ${completed+1} of ${selected.length}: ${file.name}`;const form=new FormData();form.append('folder','Inbox');form.append('file',file,file.name);await request('/v1/companion/upload',{method:'POST',headers:headers(),body:form});completed++}uploadStatus.className='bar success';uploadStatus.textContent=`Uploaded ${completed} file${completed===1?'':'s'} to your PC.`;picker.value='';await loadFiles()}catch(error){uploadStatus.className='bar error';uploadStatus.textContent=`Uploaded ${completed} of ${selected.length}. ${error.message}`}finally{pickButton.disabled=false}}$('sendButton').onclick=()=>send();msg.addEventListener('keydown',event=>{if(event.key==='Enter')send()});pickButton.onclick=()=>picker.click();picker.onchange=uploadSelected;loadFiles();if('serviceWorker'in navigator)navigator.serviceWorker.register('/companion-sw.js').catch(()=>{});
</script></body></html>
