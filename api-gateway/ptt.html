<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis V25 · Push to talk</title>
<style>body{background:#091321;color:#e7f5ff;font:17px system-ui;max-width:720px;margin:40px auto;padding:20px}button,input,textarea{font:inherit;background:#14273d;color:inherit;border:1px solid #5fbad0;border-radius:12px;padding:14px;box-sizing:border-box}input,textarea{width:100%;margin:12px 0}button{touch-action:none;cursor:pointer}#talk{width:100%}pre{white-space:pre-wrap}a{color:#80ddff}</style>
<h1>Push to talk</h1><p>Hold to dictate, then review and send. Replies appear as text. Speech recognition availability and processing depend on your browser.</p>
<input id="token" type="password" placeholder="API token" aria-label="API token">
<button id="talk">Hold to dictate (or hold Space)</button><p id="status" role="status">Microphone off</p>
<textarea id="text" rows="5" aria-label="Message" placeholder="Type or dictate a message"></textarea>
<button id="send">Send</button><div id="approval" hidden><p>Review the proposed action above before approving.</p><button id="approve">Approve action</button><button id="cancel">Cancel action</button></div><pre id="reply" aria-live="polite"></pre><a href="/companion">Companion and action approvals</a>
<script>
const talk=document.getElementById('talk'),status=document.getElementById('status'),input=document.getElementById('text'),token=document.getElementById('token'),reply=document.getElementById('reply');
token.value=sessionStorage.getItem('jarvisApiToken')||sessionStorage.getItem('ai_api_token')||'';
token.onchange=()=>sessionStorage.setItem('jarvisApiToken',token.value);
let recorder=null,stream=null,chunks=[],held=false,started=0;
async function start(){if(held||recorder)return;held=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=transcribe;recorder.start(250);started=Date.now();talk.classList.add('recording');status.textContent='Listening while held'}catch(e){cleanup();status.textContent=e.name==='NotAllowedError'?'Microphone permission denied. Allow microphone access and retry.':'Microphone error: '+e.message}}
function cleanup(){stream?.getTracks().forEach(t=>t.stop());stream=null;recorder=null;held=false;talk.classList.remove('recording')}
function stop(cancel=false){held=false;if(!recorder)return;if(cancel||Date.now()-started<250){recorder.onstop=null;recorder.stop();cleanup();status.textContent=cancel?'Microphone off':'Hold the button while speaking';return}recorder.stop();status.textContent='Transcribing…'}
async function transcribe(){const mime=recorder?.mimeType||'audio/webm',blob=new Blob(chunks,{type:mime});cleanup();if(!blob.size){status.textContent='No audio captured';return}const form=new FormData();form.append('audio',blob,'push-to-talk.webm');try{const headers={};if(token.value)headers.Authorization='Bearer '+token.value;const r=await fetch('/v1/voice/transcribe',{method:'POST',headers,body:form});const data=await r.json();if(!r.ok)throw Error(data.detail||'Transcription failed');const text=(data.transcript||'').trim();if(text)input.value=(input.value+' '+text).trim();status.textContent=text?'Microphone off · review your message':'No speech detected'}catch(e){status.textContent='Transcription failed: '+e.message}}
talk.onpointerdown=e=>{e.preventDefault();talk.setPointerCapture(e.pointerId);start()};talk.onpointerup=()=>stop();talk.onpointercancel=()=>stop(true);talk.onlostpointercapture=()=>{if(held)stop(true)};
talk.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)start()}};talk.onkeyup=e=>{if(e.code==='Space'){e.preventDefault();stop()}};
window.addEventListener('blur',()=>stop(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)stop(true)});window.addEventListener('pagehide',()=>stop(true));
if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){talk.disabled=true;status.textContent='Microphone recording is unavailable in this browser.'}
let pending=null;
function showResponse(data){reply.textContent=data.message?.content||JSON.stringify(data,null,2);pending=data.confirmation||null;document.getElementById('approval').hidden=!pending}
async function confirmAction(confirmed){if(!pending)return;const ticket=pending.confirmation_id;pending=null;document.getElementById('approval').hidden=true;try{const r=await fetch('/v1/companion/confirm',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token.value},body:JSON.stringify({confirmation_id:ticket,confirmed})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Confirmation failed');showResponse(data)}catch(e){reply.textContent=e.message}}
document.getElementById('approve').onclick=()=>confirmAction(true);document.getElementById('cancel').onclick=()=>confirmAction(false);
document.getElementById('send').onclick=async()=>{stop();const text=input.value.trim();if(!text)return;const button=document.getElementById('send');button.disabled=true;reply.textContent='Working…';try{const r=await fetch('/v1/companion/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token.value},body:JSON.stringify({model:'auto',messages:[{role:'user',content:text}]})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');showResponse(data)}catch(e){reply.textContent=e.message}finally{button.disabled=false}};
</script></html>
