<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis Local Voice Lab</title><style>
:root{color-scheme:dark}body{margin:0;background:#020a11;color:#eef6ff;font:15px/1.5 Segoe UI,system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(760px,92vw);border:1px solid #287ba5;border-radius:22px;background:#051522;padding:25px;box-shadow:0 0 40px #008cff22}h1{margin:0}.state{color:#6ed8ff;margin:8px 0 20px}.controls{display:flex;gap:10px;flex-wrap:wrap}button,input{font:inherit;color:inherit;border:1px solid #317292;background:#082238;border-radius:12px;padding:11px 16px}button.primary{background:#075fc5}.active{box-shadow:0 0 20px #00b7ff}.log{margin-top:20px;max-height:52vh;overflow:auto}.msg{padding:9px 0;border-bottom:1px solid #173447;white-space:pre-wrap}.you{color:#8ddcff}.jarvis{color:#bfffd8}.warn{color:#ffb4b4}.privacy{font-size:12px;color:#9fb5c8;margin-top:16px}</style></head><body><main class="card"><h1>Jarvis Local Voice Lab</h1><div id="state" class="state">Stopped · experimental mode</div><div class="controls"><button id="start" class="primary">Start voice mode</button><button id="stop" disabled>Stop</button><input id="token" type="password" placeholder="API token, if enabled"></div><div id="log" class="log"></div><div class="privacy">The microphone starts only when you press Start. Press Stop or leave this page to release it. Text remains available if local speech output fails.</div></main><script>
const state=document.querySelector('#state'),log=document.querySelector('#log'),start=document.querySelector('#start'),stop=document.querySelector('#stop'),token=document.querySelector('#token');let ws,ctx,stream,node,source,nextPlay=0,playing=[];
function add(kind,text){const d=document.createElement('div');d.className='msg '+kind;d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight}
function flush(){for(const s of playing)try{s.stop()}catch{}playing=[];nextPlay=ctx?.currentTime||0}
function pcm16(samples,rate){const ratio=rate/16000,n=Math.floor(samples.length/ratio),out=new Int16Array(n);for(let i=0;i<n;i++){const start=Math.floor(i*ratio),end=Math.min(samples.length,Math.max(start+1,Math.floor((i+1)*ratio)));let sum=0;for(let j=start;j<end;j++)sum+=samples[j];const v=Math.max(-1,Math.min(1,sum/Math.max(1,end-start)));out[i]=v<0?v*32768:v*32767}return out.buffer}
function play(buffer,rate=24000){if(!ctx)return;const pcm=new Int16Array(buffer),audio=ctx.createBuffer(1,pcm.length,rate),ch=audio.getChannelData(0);for(let i=0;i<pcm.length;i++)ch[i]=pcm[i]/32768;const s=ctx.createBufferSource();s.buffer=audio;s.connect(ctx.destination);nextPlay=Math.max(nextPlay,ctx.currentTime+.02);s.start(nextPlay);nextPlay+=audio.duration;playing.push(s);s.onended=()=>playing=playing.filter(x=>x!==s)}
async function begin(){start.disabled=true;try{ctx=new AudioContext();await ctx.audioWorklet.addModule('/voice-duplex-worklet.js');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});source=ctx.createMediaStreamSource(stream);node=new AudioWorkletNode(ctx,'jarvis-capture');node.port.onmessage=e=>{if(ws?.readyState===1)ws.send(pcm16(e.data.samples,e.data.rate))};source.connect(node);const mute=ctx.createGain();mute.gain.value=0;node.connect(mute);mute.connect(ctx.destination);const scheme=location.protocol==='https:'?'wss':'ws',q=token.value?'?token='+encodeURIComponent(token.value):'';ws=new WebSocket(`${scheme}://${location.host}/v1/voice/duplex${q}`);ws.binaryType='arraybuffer';ws.onopen=()=>{state.textContent='Listening · local duplex active';start.classList.add('active');stop.disabled=false};ws.onmessage=e=>{if(e.data instanceof ArrayBuffer)return play(e.data);const m=JSON.parse(e.data);if(m.event==='transcript_final')add('you','You: '+m.text);if(m.event==='response_text')add('jarvis','Jarvis: '+m.text);if(m.event==='interrupt')flush();if(m.event==='error')add('warn','Error: '+m.message);state.textContent=m.event.replaceAll('_',' ')};ws.onclose=e=>{if(e.reason)add('warn',e.reason);end()}}catch(e){add('warn',e.message);end()}}
function end(){flush();try{ws?.close()}catch{};for(const t of stream?.getTracks()||[])t.stop();try{node?.disconnect();source?.disconnect();ctx?.close()}catch{};ws=ctx=stream=node=source=null;start.disabled=false;stop.disabled=true;start.classList.remove('active');state.textContent='Stopped · experimental mode'}
start.onclick=begin;stop.onclick=end;window.addEventListener('pagehide',end);document.addEventListener('visibilitychange',()=>{if(document.hidden)end()});
</script></body></html>
