name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api-gateway/requirements.txt pytest ruff
      - name: Lint gate (F401, I001, UP006, UP045)
        run: python -m ruff check --select F401,I001,UP006,UP045 api-gateway tests tools
      - name: Run tests
        run: pytest -q
